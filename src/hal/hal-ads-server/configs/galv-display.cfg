# HAL-ADS symbol mapping for GalvPLC DISPLAY_DATA GVL.
#
# Struct layout (ST_DISP_DATA, ST_DISP_ERRORS, etc.) matches the TwinCAT PLC
# type definitions.  No manual padding is required: the server automatically
# inserts struct-start and struct-end alignment padding so that symbol offsets
# match TwinCAT's natural (C-compiler-style) alignment.
#
# Direction convention:
#   out  – HAL component produces the value  (HMI reads from HAL / PLC)
#   in   – HAL component receives the value  (HMI writes  to  HAL / PLC)

DISPLAY_DATA
  stData
    out dtCurrentTime DT
    out bGlobalErr BOOL
    out bAckErr BOOL
    aPools[1..1]
      out sPoolName STRING(31)
      out nFormulaId DWORD
      out sFormulaName STRING(31)
      out eState WORD
      out fTemp REAL
      out fCurrent REAL
      out fVoltage REAL
      out fTiltPos REAL
      out fTiltVelo REAL
      out fSectPos REAL
      out fSectVelo REAL
      out fLeakPress REAL
      out tProcTimeTotal TIME
      out tProcTimeRem TIME
      out tPhaseTimeTotal TIME
      out tPhaseTimeRem TIME
      out nShiftCurr WORD
      out nShiftCount WORD
      out nRepeatCurr WORD
      out nRepeatCount WORD
      out fTempSetpoint REAL
      out bPumpOnIdle BOOL
      out tMixerTimeManual TIME
      out tMixerTimeAuto TIME
      in bManuEnable BOOL
      in bFormStart BOOL
      in bFormStop BOOL
      in bFormPause BOOL
      in bTiltJogPos BOOL
      in bTiltJogNeg BOOL
      in bSectJogNeg BOOL
      stMsg
        out eType WORD
        out bEnableOk BOOL
        out bEnableCancel BOOL
        in bOk BOOL
        in bCancel BOOL
      aMixers[1..4]
        out fPower REAL
        in bManu BOOL
  stErrors
    stGlobalErrors
      out bEmergStop BOOL
      out bDriveSupplyErr BOOL
      out bTempWarn BOOL
      out bTempErr BOOL
    aPoolErrors[1..1]
      out bHeaterTempWarn BOOL
      out bHeaterSensorErr BOOL
      out bHeaterSafetyErr BOOL
      out bTiltDriveWarn BOOL
      out bTiltDriveErr BOOL
      out bTiltFollowingErr BOOL
      out bSectDriveWarn BOOL
      out bSectDriveErr BOOL
      out bSectFollowingErr BOOL
      out bPsComErr BOOL
      out bPsTempWarn BOOL
      out bPsTempErr BOOL
      out bPsCurrErr BOOL
      out bPsVoltErr BOOL
      aMixerErrors[1..4]
        out bDriveWarn BOOL
        out bDriveErr BOOL
        out bOverloadErr BOOL
        out bUnderloadWarn BOOL
        out bVeloErr BOOL
