# tests/server/hal-only.ini
# Minimal HAL-only INI configuration for linuxcnc-server.
#
# No [TASK], no [DISPLAY], no [EMCIO] — linuxcnc-server runs in HAL-only mode.
# A custom UI can connect via HAL pins directly (e.g., via hal-go or hal-ads-server).

[EMC]
MACHINE = MyHALMachine

[HAL]
HALFILE = hal-only.hal
