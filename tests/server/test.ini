# tests/server/test.ini
# Full CNC test INI configuration for linuxcnc-server

[EMC]
MACHINE = TestMachine
VERSION = 1.0
DEBUG = 0

[DISPLAY]
DISPLAY = dummy
CYCLE_TIME = 0.100

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = test.var
SUBROUTINE_PATH = .

[EMCMOT]
EMCMOT = motmod
SERVO_PERIOD = 1000000
COMM_TIMEOUT = 1.0

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[HAL]
HALFILE = test.hal
HALUI = halui

[TRAJ]
COORDINATES = X Y Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
MAX_VELOCITY = 100
MAX_ACCELERATION = 500

[KINS]
KINEMATICS = trivkins coordinates=xyz
JOINTS = 3

[AXIS_X]
MAX_VELOCITY = 100
MAX_ACCELERATION = 500
MIN_LIMIT = -100
MAX_LIMIT = 100

[AXIS_Y]
MAX_VELOCITY = 100
MAX_ACCELERATION = 500
MIN_LIMIT = -100
MAX_LIMIT = 100

[AXIS_Z]
MAX_VELOCITY = 50
MAX_ACCELERATION = 250
MIN_LIMIT = -50
MAX_LIMIT = 0

[JOINT_0]
TYPE = LINEAR
HOME = 0
MAX_VELOCITY = 100
MAX_ACCELERATION = 500
MIN_LIMIT = -100
MAX_LIMIT = 100

[JOINT_1]
TYPE = LINEAR
HOME = 0
MAX_VELOCITY = 100
MAX_ACCELERATION = 500
MIN_LIMIT = -100
MAX_LIMIT = 100

[JOINT_2]
TYPE = LINEAR
HOME = 0
MAX_VELOCITY = 50
MAX_ACCELERATION = 250
MIN_LIMIT = -50
MAX_LIMIT = 0
